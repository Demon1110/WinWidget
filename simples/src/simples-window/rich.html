<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>整页 HTML</title>
  <style>
    html, body { margin: 0; height: 100%; }
    /* dialog.window 的窗口本身是透明 + 圆角的，底色和内容都由这一页自己画。 */
    body {
      box-sizing: border-box;
      display: flex; flex-direction: column;
      border-radius: 14px;
      overflow: hidden;
      background: var(--w-bg-solid, #12161a);
      color: var(--w-fg, #e9eef2);
      font: 13px/1.55 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .head {
      flex: none;
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px 6px;
      font-size: 15px; font-weight: 600;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--w-accent, #4cc2ff);
      box-shadow: 0 0 10px var(--w-accent, #4cc2ff);
    }
    .body { flex: 1 1 auto; padding: 4px 16px 8px; overflow-y: auto; }
    .body p { margin: 0 0 8px; opacity: 0.8; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .chip {
      padding: 2px 9px; border-radius: 999px; font-size: 12px;
      border: 1px solid var(--w-line, rgba(255, 255, 255, 0.16));
      background: rgba(255, 255, 255, 0.06);
    }
    .chip.hot { border-color: transparent; background: var(--w-accent, #4cc2ff); color: #08131a; font-weight: 600; }
    .body ul { margin: 0; padding-left: 18px; opacity: 0.75; }
    .foot {
      flex: none;
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 10px 16px 14px;
    }
    .foot button {
      padding: 7px 16px; border-radius: 10px; cursor: pointer; font: inherit;
      border: 1px solid var(--w-line, rgba(255, 255, 255, 0.16));
      background: transparent; color: inherit;
    }
    .foot button.primary { border-color: transparent; background: var(--w-accent, #4cc2ff); color: #08131a; font-weight: 600; }
  </style>
</head>
<body>
  <div class="head"><span class="dot"></span>整页 HTML</div>
  <div class="body">
    <p>这个窗口的每一像素都由 <code>rich.html</code> 画。</p>
    <div class="chips">
      <span class="chip hot">HTML</span>
      <span class="chip">dialog.window</span>
      <span class="chip">圆角 + 透明窗</span>
    </div>
    <ul>
      <li>外观仍按弹框算：无边框、圆角、淡入、跟着卡片主题走。</li>
      <li>内容、尺寸、按钮位置全归组件，宿主只负责开窗和收结果。</li>
    </ul>
  </div>
  <div class="foot">
    <button type="button" data-id="dismiss">先不用</button>
    <button type="button" class="primary" data-id="apply">就用它</button>
  </div>
  <script>
    // 页面自己交卷：win.result 带 button，关闭方拿到 { button, reason }。
    for (const b of document.querySelectorAll("button")) {
      b.addEventListener("click", () => {
        widget.call("win.result", { button: b.dataset.id, reason: "button" }).catch(() => {});
      });
    }
  </script>
</body>
</html>
