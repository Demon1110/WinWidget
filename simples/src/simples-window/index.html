<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>多窗口测试台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="eyebrow">widget.windows</div>
    <h1>多窗口测试台</h1>
    <p class="hint">先点「开窗」，再点其它项；子窗里自己也会显示收到的消息。</p>
  </header>

  <section id="cases" class="cases"></section>

  <section class="log">
    <div class="log-head">
      <span>结果</span>
      <button id="clear" type="button">清空</button>
    </div>
    <ol id="results"></ol>
  </section>

  <script src="main.js"></script>
</body>
</html>
