<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>弹框测试台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="eyebrow">widget.dialog</div>
    <h1>弹框测试台</h1>
    <p class="hint">点一项，看弹框是否符合「期望」。结果会写进下面的记录。</p>
  </header>

  <section id="cases" class="cases"></section>

  <section class="log">
    <div class="log-head">
      <span>结果</span>
      <button id="clear" type="button">清空</button>
    </div>
    <ol id="results"></ol>
  </section>

  <script src="main.js"></script>
</body>
</html>
