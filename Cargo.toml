[package]
name = "winwidget"
version = "1.0.0"
edition = "2021"
description = "WinWidget — desktop widgets for Windows, written in Rust: HTML/CSS/JS widgets, themes and a control center"
license = "GPL-3.0-only"

[dependencies]
tao = "0.35"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
ureq = { version = "2.12", features = ["tls", "gzip", "brotli", "json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
notify = "8"
rfd = "0.18"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_System_LibraryLoader",
  "Win32_System_Shutdown",
  "Win32_System_Power",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Diagnostics",
  "Media",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
] }
sysinfo = "0.40.1"
winreg = "0.56.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
