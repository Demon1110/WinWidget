<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="bloom">
    <header class="head">
      <div class="titles">
        <h1 class="name" id="name"></h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="badge" id="badge"><i class="dot" id="dot"></i><span id="stateText"></span></div>
    </header>

    <nav class="cats" id="cats" data-no-drag></nav>

    <div class="grid" id="grid" data-no-drag></div>

    <footer class="foot" data-no-drag>
      <button class="w-btn" id="blind"></button>
      <button class="w-btn" id="stop"></button>
    </footer>

    <p class="hint" id="hint"></p>
    <div class="toast" id="toast" hidden></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
