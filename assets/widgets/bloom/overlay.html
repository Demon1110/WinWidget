<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>玩出花 - 特效渲染</title>
  <style>
    /* 这一页就是新的桌面壁纸（挂在图标层之下），不是盖在桌面上的透明卡片。
       宿主会给自定义窗口注入 base.css / 主题 CSS / 卡片外观，这里钉死尺寸与交互。
       背景不能用 !important 简写：它会把 background-image 一并压成 none，
       overlay.js 设置的壁纸图（/__wallpaper）就再也显示不出来了；深色只是图片加载前的兜底。 */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      background-color: #0a0e1a;
      opacity: 1 !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      text-shadow: none !important;
      transform: none !important;
      zoom: 1 !important;
      pointer-events: none !important;
    }
    #bloom-canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
      pointer-events: none !important;
    }
    /* SDK 会往自定义窗口塞卡片用的缩放手柄 / 编辑标签 / 报错条；壁纸层一概不要。 */
    .fw-resize, .fw-edit-label, .fw-error-bar, .fw-ring {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- SDK 会在 DOMContentLoaded 之后自己发 ready，卡片那边的新窗口回调因此能挂上第一支特效。 -->
  <script src="three.iife.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
