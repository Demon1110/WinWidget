<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="po">
    <header>
      <span class="name" id="title"></span>
      <span class="dyn" id="dyn"></span>
    </header>

    <div class="sheet">
      <div class="pt" id="pt"></div>
      <div class="lines" id="lines"></div>
    </div>

    <footer data-no-drag>
      <button class="w-btn nav" id="prev" aria-label="previous">‹</button>
      <span class="mark" id="mark"></span>
      <button class="w-btn nav" id="next" aria-label="next">›</button>
      <button class="w-btn copy" id="copy"></button>
    </footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
