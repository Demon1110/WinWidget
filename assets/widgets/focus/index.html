<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="fo">
    <header>
      <span class="name" id="title"></span>
      <span class="date" id="date"></span>
    </header>

    <div class="body" id="body">
      <div class="ask" id="ask">
        <input class="w-input" id="input" autocomplete="off" spellcheck="false" data-no-drag>
        <button class="w-btn is-primary" id="set" data-no-drag></button>
      </div>

      <div class="card" id="card" hidden>
        <div class="ttl" id="ttl" data-no-drag></div>
        <input class="w-input hidden-input" id="editInput" autocomplete="off" spellcheck="false" data-no-drag hidden>
        <textarea class="w-input why" id="why" spellcheck="false" data-no-drag></textarea>
      </div>
    </div>

    <footer id="foot">
      <button class="w-check" id="done" role="checkbox" aria-checked="false" data-no-drag></button>
      <span class="mark" id="mark"></span>
      <span class="streak" id="streak"></span>
      <button class="w-btn clear" id="clear" data-no-drag></button>
    </footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
