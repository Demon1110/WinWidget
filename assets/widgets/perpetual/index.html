<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="al">
    <header>
      <button class="ym" id="ym" data-no-drag></button>
      <nav>
        <button class="w-btn" id="prev" data-no-drag title="">‹</button>
        <button class="w-btn go" id="go" data-no-drag></button>
        <button class="w-btn" id="next" data-no-drag title="">›</button>
      </nav>
    </header>
    <div class="week" id="week"></div>
    <div class="grid" id="grid"></div>
    <button class="foot" id="foot" data-no-drag></button>
  </main>

  <div class="tip" id="tip" hidden></div>

  <div class="pick" id="pick" hidden>
    <div class="veil" data-close></div>
    <div class="pick-card">
      <div class="pick-top">
        <button class="w-btn" id="py-" data-no-drag>‹</button>
        <button class="w-btn pick-year" id="pyear" data-no-drag></button>
        <button class="w-btn" id="py+" data-no-drag>›</button>
        <button class="w-btn pick-x" id="pclose" data-no-drag>✕</button>
      </div>
      <div class="months" id="months"></div>
      <div class="years" id="years" hidden></div>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="veil" data-close></div>
    <div class="sheet-card" id="sheetCard"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
