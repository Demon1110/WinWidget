<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="qr">
    <header>
      <span class="w-title name" id="title"></span>
      <span class="lvl w-num" id="lvl"></span>
    </header>

    <input class="w-input" id="text" autocomplete="off" spellcheck="false" data-no-drag>

    <div class="plate" id="plate">
      <canvas id="code"></canvas>
      <div class="plate-note" id="note"></div>
    </div>

    <footer>
      <span class="bytes w-num" id="bytes"></span>
      <span class="spacer"></span>
      <button class="w-btn" id="paste" data-no-drag></button>
      <button class="w-btn" id="copy" data-no-drag></button>
      <button class="w-btn clear" id="clear" data-no-drag></button>
    </footer>
    <div class="toast" id="toast" hidden></div>
  </main>
  <script src="qr.js"></script>
  <script src="main.js"></script>
</body>
</html>
