<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="units">
    <nav class="tabs" id="tabs" data-no-drag></nav>

    <div class="convert">
      <div class="field">
        <input class="w-input value" id="value" inputmode="decimal" autocomplete="off" spellcheck="false" data-no-drag>
        <select class="w-input unit" id="fromUnit" data-no-drag></select>
      </div>
      <button class="w-btn swap" id="swap" data-no-drag title="">
        <svg viewBox="0 0 24 24"><path d="M8 4.5v15M4.5 8 8 4.5 11.5 8M16 19.5v-15M12.5 16l3.5 3.5 3.5-3.5"/></svg>
      </button>
      <div class="field">
        <div class="value out w-num" id="out"></div>
        <select class="w-input unit" id="toUnit" data-no-drag></select>
      </div>
    </div>

    <p class="hint" id="hint"></p>
  </main>
  <script src="main.js"></script>
</body>
</html>
