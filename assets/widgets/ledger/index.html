<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="led">
    <header>
      <span class="name" id="title"></span>
      <span class="month" id="month"></span>
    </header>

    <div class="entry">
      <div class="seg" id="seg" data-no-drag>
        <button class="s" data-k="out"></button>
        <button class="s" data-k="in"></button>
      </div>
      <div class="amt">
        <span class="cur" id="cur">¥</span>
        <input id="amt" class="w-input" inputmode="decimal" autocomplete="off" spellcheck="false" data-no-drag>
      </div>
    </div>

    <div class="cats" id="cats" data-no-drag></div>
    <button class="w-btn is-primary add" id="add" data-no-drag></button>

    <ul class="list" id="list" data-no-drag></ul>
    <div class="toast" id="toast" hidden></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
