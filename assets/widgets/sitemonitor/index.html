<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sm">
    <header>
      <span class="name" id="title"></span>
      <span class="sum" id="sum"></span>
      <button class="w-btn refresh" id="refresh" data-no-drag>
        <svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V8h-3.5"/></svg>
      </button>
    </header>

    <form class="add" id="form" data-no-drag>
      <input class="w-input" id="host" autocomplete="off" spellcheck="false">
      <button class="w-btn" id="addBtn" type="submit">+</button>
    </form>

    <ul class="list" id="list" data-no-drag></ul>
    <p class="hint" id="hint"></p>
  </main>
  <script src="main.js"></script>
</body>
</html>
