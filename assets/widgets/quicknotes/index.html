<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="qn">
    <header>
      <span class="name" id="title"></span>
      <span class="stat" id="stat"></span>
    </header>

    <textarea class="pad" id="pad" spellcheck="false" data-no-drag></textarea>

    <footer data-no-drag>

      <button class="w-btn" id="paste"></button>
      <button class="w-btn" id="clear"></button>
      <span class="saved" id="saved"></span>
    </footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
