<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dp">
    <header>
      <span class="name" id="title"></span>
      <span class="plan" id="plan"></span>
    </header>

    <div class="big">
      <b id="used" class="w-num">--</b>
      <span class="unit">GB</span>
      <span class="rest" id="rest"></span>
    </div>

    <div class="meter"><i id="fill"></i><span class="mark" id="mark"></span></div>

    <div class="legend">
      <span id="down"></span>
      <span id="up"></span>
    </div>

    <p class="hint" id="hint"></p>
  </main>
  <script src="main.js"></script>
</body>
</html>
