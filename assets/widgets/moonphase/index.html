<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="mo">
    <header>
      <span class="name" id="title"></span>
      <span class="today" id="today"></span>
    </header>

    <div class="stage">
      <canvas id="moon" width="160" height="160"></canvas>
    </div>

    <div class="info">
      <b class="phase" id="phase"></b>
      <span class="pct" id="pct"></span>
    </div>

    <p class="hint" id="hint"></p>
  </main>
  <script src="main.js"></script>
</body>
</html>
