<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wa">
    <header>
      <span class="name" id="title"></span>
      <span class="goal" id="goal"></span>
    </header>

    <div class="big">
      <b id="cups" class="w-num">0</b>
      <span class="sub" id="sub"></span>
    </div>

    <div class="row" id="row" data-no-drag></div>

    <div class="acts" data-no-drag>
      <button class="w-btn minus" id="minus" aria-label="minus">−</button>
      <button class="w-btn is-primary plus" id="plus"></button>
    </div>

    <p class="hint" id="hint"></p>
    <div class="toast" id="toast" hidden></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
